<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Producto - DreesOutfit</title>
  <!-- Tailwind CSS para diseño moderno -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl shadow-xl w-full max-w-sm text-center">
    <h2 class="text-xs uppercase tracking-widest text-amber-400 font-semibold mb-2">DreesOutfit</h2>
    
    <!-- Contenedor donde se cargarán los datos dinámicos -->
    <div id="detalles-producto" class="space-y-4">
      <div class="animate-pulse">
        <div class="h-6 bg-slate-700 rounded w-3/4 mx-auto mb-3"></div>
        <div class="h-8 bg-slate-700 rounded w-1/2 mx-auto"></div>
      </div>
    </div>
  </div>

  <script>
    // Inicializa tu cliente de Supabase (reemplaza con tus credenciales reales si difieren)
    const SUPABASE_URL = 'https://zzmojfukciqbxrjnmdeo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_m6UEIb277hu0TvPTnFaGyg_FzFiKixX';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function cargarDatosPublicosProducto() {
      // Obtenemos el ID de la prenda desde la URL (ej: producto.html?id=123)
      const params = new URLSearchParams(window.location.search);
      const productoId = params.get('id');
      const contenedor = document.getElementById('detalles-producto');

      if (!productoId) {
        contenedor.innerHTML = `<p class="text-red-400 font-medium">No se encontró el producto especificado.</p>`;
        return;
      }

      // Buscamos el producto en la base de datos
      const { data, error } = await _supabase
        .from('productos')
        .select('*')
        .eq('id', productoId)
        .single();

      if (error || !data) {
        contenedor.innerHTML = `<p class="text-red-400 font-medium">No pudimos cargar los datos de esta prenda.</p>`;
        return;
      }

      // Mostramos los datos reales en pantalla
      contenedor.innerHTML = `
        <h1 class="text-2xl font-bold text-white">${data.nombre || 'Prenda sin nombre'}</h1>
        <p class="text-3xl font-extrabold text-emerald-400 mt-2">$${Number(data.precio_venta || 0).toLocaleString()}</p>
        <p class="text-xs text-slate-400 mt-2">Código: ${data.codigo_barras || '-'}</p>
        <div class="mt-6 pt-4 border-t border-slate-700 text-xs text-slate-500">
          Consultado desde el sistema oficial
        </div>
      `;
    }

    cargarDatosPublicosProducto();
  </script>
</body>
</html>
