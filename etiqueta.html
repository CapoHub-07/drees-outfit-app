<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Imprimir Etiqueta QR</title>
  <style>
    body { 
      font-family: 'Helvetica Neue', Arial, sans-serif; 
      text-align: center; 
      margin: 0; 
      padding: 10px;
      color: #000;
      background: #fff;
    }
    .etiqueta-box {
      border: 2px dashed #000;
      padding: 15px;
      display: inline-block;
      width: 260px;
    }
    .marca { 
      font-size: 14px; 
      font-weight: 900; 
      letter-spacing: 2px; 
      margin-bottom: 2px;
    }
    #canvas-qr { 
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px auto;
      width: 140px; 
      height: 140px; 
    }
    #img-qr {
      width: 140px;
      height: 140px;
    }
    .precio { 
      font-size: 20px; 
      font-weight: bold; 
      margin-top: 4px;
    }
    .caracteristicas {
      font-size: 10px;
      color: #555;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="etiqueta-box">
    <div class="marca">DREES OUTFIT</div>
    <div id="lbl-nombre" class="marca" style="font-size:12px; font-weight:normal; letter-spacing:normal;">Cargando...</div>
    <div id="lbl-caracteristicas" class="caracteristicas">Talle: - | Color: -</div>
    
    <!-- Contenedor donde se pintará el QR Dinámico -->
    <div id="canvas-qr">
      <img id="img-qr" src="" alt="Código QR Dinámico" />
    </div>
    
    <div id="lbl-precio" class="precio">$0</div>
    <div id="lbl-codigo" style="font-size: 8px; color: #888; font-family: monospace; margin-top: 4px;">-</div>
  </div>

  <script>
    // 1. Leemos los parámetros que viajan por la URL desde el index.html
    const urlParams = new URLSearchParams(window.location.search);
    const codigo = urlParams.get('codigo') || '000000';
    const nombre = urlParams.get('nombre') || 'Producto';
    const precio = parseFloat(urlParams.get('precio')) || 0;
    const talle = urlParams.get('talle') || '-';
    const color = urlParams.get('color') || '-';
    
    // Capturamos el enlace dinámico que te lleva a consulta.html
    const urlQR_Dinamico = urlParams.get('urlqr') || (window.location.origin + '/consulta.html?codigo=' + codigo);

    // 2. Inyectamos los datos reales de la prenda en la pantalla visual
    document.getElementById('lbl-nombre').textContent = nombre;
    document.getElementById('lbl-caracteristicas').textContent = 'Talle: ' + talle + ' | Color: ' + color;
    document.getElementById('lbl-precio').textContent = '$' + precio.toLocaleString('es-AR');
    document.getElementById('lbl-codigo').textContent = codigo;

    // 3. Generamos el QR Dinámico usando la API global de QRServer (Formato seguro)
    const imgElement = document.getElementById('img-qr');
    imgElement.src = 'https://qrserver.com' + encodeURIComponent(urlQR_Dinamico);

    // 4. Esperamos a que la imagen del enlace se dibuje físicamente en la pantalla antes de mandar a imprimir
    imgElement.onload = function() {
      setTimeout(function() {
        window.print();
        setTimeout(function() { window.close(); }, 500);
      }, 500);
    };

    // Respaldo por si hay microcortes de conexión
    setTimeout(function() {
      if (!imgElement.complete) {
        window.print();
        setTimeout(function() { window.close(); }, 500);
      }
    }, 2500);
  </script>
</body>
</html>
