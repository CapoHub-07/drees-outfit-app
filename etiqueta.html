<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Imprimir Etiqueta QR</title>
  <style>
    body { 
      font-family: 'Helvetica Neue', Arial, sans-serif; 
      text-align: center; 
      margin: 0; 
      padding: 10px;
      color: #000;
      background: #fff;
    }
    .etiqueta-box {
      border: 2px dashed #000;
      padding: 15px;
      display: inline-block;
      width: 260px;
    }
    .marca { 
      font-size: 14px; 
      font-weight: 900; 
      letter-spacing: 2px; 
      margin-bottom: 2px;
    }
    #canvas-qr { 
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px auto;
      width: 140px; 
      height: 140px; 
    }
    #img-qr {
      width: 140px;
      height: 140px;
      display: block;
    }
    .precio { 
      font-size: 20px; 
      font-weight: bold; 
      margin-top: 4px;
    }
    .caracteristicas {
      font-size: 10px;
      color: #555;
      margin-bottom: 4px;
    }

    /* Regla esencial para que el navegador no elimine imágenes al imprimir */
    @media print {
      body {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      #img-qr {
        display: block !important;
        visibility: visible !important;
      }
    }
  </style>
</head>
<body>

  <div class="etiqueta-box">
    <div class="marca">DREES OUTFIT</div>
    <div id="lbl-nombre" class="marca" style="font-size:12px; font-weight:normal; letter-spacing:normal;">Cargando...</div>
    <div id="lbl-caracteristicas" class="caracteristicas">Talle: - | Color: -</div>
    
    <!-- Contenedor del QR -->
    <div id="canvas-qr">
      <img id="img-qr" src="" alt="Código QR Dinámico" />
    </div>
    
    <div id="lbl-codigo" style="font-size: 8px; color: #888; font-family: monospace; margin-top: 4px;">-</div>
  </div>

  <script>
    // 1. Leemos los parámetros que viajan por la URL desde el index.html
    const urlParams = new URLSearchParams(window.location.search);
    const codigo = urlParams.get('codigo') || '000000';
    const nombre = urlParams.get('nombre') || 'Producto';
    const precio = parseFloat(urlParams.get('precio')) || 0;
    const talle = urlParams.get('talle') || '-';
    const color = urlParams.get('color') || '-';
    
    // Capturamos el enlace dinámico que te lleva a consulta.html
    const urlQR_Dinamico = urlParams.get('urlqr') || (window.location.origin + '/consulta.html?codigo=' + codigo);

    // 2. Inyectamos los datos reales en la vista
    document.getElementById('lbl-nombre').textContent = nombre;
    document.getElementById('lbl-caracteristicas').textContent = 'Talle: ' + talle + ' | Color: ' + color;
    document.getElementById('lbl-codigo').textContent = codigo;

    // 3. Generamos la URL correcta de la API de QRServer
    const imgElement = document.getElementById('img-qr');
    const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(urlQR_Dinamico)}`;

    // Función para ejecutar el diálogo de impresión una sola vez
    let impreso = false;
    function dispararImpresion() {
      if (impreso) return;
      impreso = true;
      
      // Pequeña pausa para asegurar renderizado visual
      setTimeout(function() {
        window.print();
        // Cierra la pestaña emergente tras la impresión o cancelación
        setTimeout(function() { window.close(); }, 300);
      }, 300);
    }

    // 4. Se dispara cuando la imagen cargó con éxito
    imgElement.onload = function() {
      dispararImpresion();
    };

    // Respaldo por si falla la carga o la conexión tarda
    imgElement.onerror = function() {
      console.error("Error al cargar la imagen del QR");
      dispararImpresion();
    };

    // Asignamos la fuente de la imagen
    imgElement.src = qrApiUrl;

    // Tiempo límite de seguridad (2.5 segundos)
    setTimeout(function() {
      dispararImpresion();
    }, 2500);
  </script>
</body>
</html>
