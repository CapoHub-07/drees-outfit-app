<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Imprimir Etiqueta QR</title>
  <style>
    @media print {
  .variantes-container {
    display: none !important;
  }
}
    body { 
      font-family: 'Helvetica Neue', Arial, sans-serif; 
      text-align: center; 
      margin: 0; 
      padding: 10px;
      color: #000;
      background: #fff;
    }
    .etiqueta-box {
      border: 2px dashed #000;
      padding: 15px;
      display: inline-block;
      width: 260px;
    }
    .marca { 
      font-size: 14px; 
      font-weight: 900; 
      letter-spacing: 2px; 
      margin-bottom: 2px;
    }
    #canvas-qr { 
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px auto;
      width: 140px; 
      height: 140px; 
    }
    #img-qr {
      width: 140px;
      height: 140px;
      display: block;
    }
    .precio { 
      font-size: 20px; 
      font-weight: bold; 
      margin-top: 4px;
    }
    .caracteristicas {
      font-size: 10px;
      color: #555;
      margin-bottom: 4px;
    }

    /* Regla esencial para que el navegador no elimine imágenes al imprimir */
    @media print {
      body {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      #img-qr {
        display: block !important;
        visibility: visible !important;
      }
    }
  </style>
  <script src="https://jsdelivr.net"></script>
</head>
<body>

  <div class="etiqueta-box">
    <div class="marca">DREES OUTFIT</div>
    <div id="lbl-nombre" class="marca" style="font-size:12px; font-weight:normal; letter-spacing:normal;">Cargando...</div>
    <div id="lbl-caracteristicas" class="caracteristicas">Talle: - | Color: -</div>
    
    <!-- Contenedor del QR -->
    <div id="canvas-qr">
      <img id="img-qr" src="" alt="Código QR Dinámico" />
    </div>
    
    <div id="lbl-codigo" style="font-size: 8px; color: #888; font-family: monospace; margin-top: 4px;">-</div>
  </div>

  <!-- PANEL DE DISPONIBILIDAD PARA EL CLIENTE -->
<div class="variantes-container" style="margin-top: 25px; padding: 15px; background: #1e293b; border: 1px solid #475569; border-radius: 12px; font-family: sans-serif; text-align: left; max-width: 300px; margin-left: auto; margin-right: auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
  <h4 style="color: #fbbf24; margin: 0 0 10px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 5px;">
    👕 Talles y Colores Disponibles
  </h4>
  <div id="lista-variantes-clientes" style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: #cbd5e1;">
    <span style="color: #94a3b8; font-style: italic;">Buscando disponibilidad en tiempo real...</span>
  </div>
</div>

  <script>
    // 1. Inicializar Supabase en la etiqueta (Reemplaza con tus credenciales reales del index.html)
const SUPABASE_URL = "https://zzmojfukciqbxrjnmdeo.supabase.co";
const SUPABASE_KEY = "sb_publishable_m6UEIb277hu0TvPTnFaGyg_FzFiKixX";
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 2. Función automática para buscar las variantes por nombre
async function cargarVariantesDelProducto() {
  const listaContainer = document.getElementById('lista-variantes-clientes');
  if (!listaContainer || !nombre) return;

  try {
    // Buscamos todas las prendas que tengan exactamente el mismo nombre en la base de datos
    const { data: variantes, error } = await _supabase
      .from('productos')
      .select('talle, color, stock_actual')
      .eq('nombre', nombre);

    if (error) throw error;

    listaContainer.innerHTML = ''; // Limpiamos el texto de carga

    if (variantes && variantes.length > 0) {
      // Recorremos cada variante encontrada para armar la lista
      variantes.forEach(v => {
        const tieneStock = v.stock_actual > 0;
        const colorStock = tieneStock ? '#34d399' : '#f87171';
        const textoStock = tieneStock ? `📦 ${v.stock_actual} un.` : '❌ Sin Stock';

        listaContainer.innerHTML += `
          <div style="background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; display: flex; justify-between: space-between; align-items: center; justify-content: space-between;">
            <div>
              <span style="color: #fff; font-weight: bold;">Talle: <b style="color: #fbbf24;">${v.talle}</b></span><br>
              <span style="color: #94a3b8; font-size: 11px;">Color: ${v.color}</span>
            </div>
            <span style="color: ${colorStock}; font-weight: bold; font-size: 11px; bg-color: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 6px;">
              ${textoStock}
            </span>
          </div>
        `;
      });
    } else {
      listaContainer.innerHTML = '<span style="color: #f87171;">No se encontraron otras variantes de este artículo.</span>';
    }
  } catch (err) {
    console.error("Error al conectar con el inventario:", err);
    listaContainer.innerHTML = '<span style="color: #f87171;">Error al consultar el stock en tiempo real.</span>';
  }
}

// Executamos la búsqueda inmediatamente al abrir la página
cargarVariantesDelProducto();

    // 1. Leemos los parámetros que viajan por la URL desde el index.html
    const urlParams = new URLSearchParams(window.location.search);
    const codigo = urlParams.get('codigo') || '000000';
    const nombre = urlParams.get('nombre') || 'Producto';
    const precio = parseFloat(urlParams.get('precio')) || 0;
    const talle = urlParams.get('talle') || '-';
    const color = urlParams.get('color') || '-';
    
    // Capturamos el enlace dinámico que te lleva a consulta.html
    const urlQR_Dinamico = urlParams.get('urlqr') || (window.location.origin + '/consulta.html?codigo=' + codigo);

    // 2. Inyectamos los datos reales en la vista
    document.getElementById('lbl-nombre').textContent = nombre;
    document.getElementById('lbl-caracteristicas').textContent = 'Talle: ' + talle + ' | Color: ' + color;
    document.getElementById('lbl-codigo').textContent = codigo;

    // 3. Generamos la URL correcta de la API de QRServer
    const imgElement = document.getElementById('img-qr');
    const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(urlQR_Dinamico)}`;

    // Función para ejecutar el diálogo de impresión una sola vez
    let impreso = false;
    function dispararImpresion() {
      if (impreso) return;
      impreso = true;
      
      // Pequeña pausa para asegurar renderizado visual
      setTimeout(function() {
        window.print();
        // Cierra la pestaña emergente tras la impresión o cancelación
        setTimeout(function() { window.close(); }, 300);
      }, 300);
    }

    // 4. Se dispara cuando la imagen cargó con éxito
    imgElement.onload = function() {
      dispararImpresion();
    };

    // Respaldo por si falla la carga o la conexión tarda
    imgElement.onerror = function() {
      console.error("Error al cargar la imagen del QR");
      dispararImpresion();
    };

    // Asignamos la fuente de la imagen
    imgElement.src = qrApiUrl;

    // Tiempo límite de seguridad (2.5 segundos)
    setTimeout(function() {
      dispararImpresion();
    }, 2500);
  </script>
</body>
</html>
