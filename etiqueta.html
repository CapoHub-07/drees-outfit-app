<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Imprimir Etiqueta QR</title>
  <style>
    body { 
      font-family: 'Helvetica Neue', Arial, sans-serif; 
      text-align: center; 
      margin: 0; 
      padding: 10px;
      color: #000;
      background: #fff;
    }
    .etiqueta-box {
      border: 2px dashed #000;
      padding: 15px;
      display: inline-block;
      width: 260px;
    }
    .marca { 
      font-size: 14px; 
      font-weight: 900; 
      letter-spacing: 2px; 
      margin-bottom: 2px;
    }
    .detalle { 
      font-size: 11px; 
      color: #444; 
      margin-bottom: 8px;
    }
    .qr-img { 
      width: 140px; 
      height: 140px; 
      margin: 5px 0;
    }
    .precio { 
      font-size: 20px; 
      font-weight: bold; 
      margin-top: 4px;
    }
    .caracteristicas {
      font-size: 10px;
      color: #555;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="etiqueta-box">
    <div class="marca">DREES OUTFIT</div>
    <div id="lbl-nombre" class="marca" style="font-size:12px; font-weight:normal; letter-spacing:normal;">Cargando...</div>
    <div id="lbl-caracteristicas" class="caracteristicas">Talle: - | Color: -</div>
    
    <!-- Imagen conectada al generador global QR -->
    <img id="img-qr" class="qr-img" src="" alt="Código QR" />
    
    <div id="lbl-precio" class="precio">$0</div>
    <div id="lbl-codigo" style="font-size: 8px; color: #888; font-family: monospace; margin-top: 4px;">-</div>
  </div>

    <script>
    // 1. Leemos los parámetros que viajan por la URL de forma segura
    const urlParams = new URLSearchParams(window.location.search);
    const codigo = urlParams.get('codigo') || '000000';
    const nombre = urlParams.get('nombre') || 'Producto';
    const precio = parseFloat(urlParams.get('precio')) || 0;
    const talle = urlParams.get('talle') || '-';
    const color = urlParams.get('color') || '-';

    // 2. Inyectamos los datos reales de la prenda en la plantilla visual
    document.getElementById('lbl-nombre').textContent = nombre;
    document.getElementById('lbl-caracteristicas').textContent = `Talle: ${talle} | Color: ${color}`;
    document.getElementById('lbl-precio').textContent = `$${precio.toLocaleString('es-AR')}`;
    document.getElementById('lbl-codigo').textContent = codigo;

    // 3. Localizamos la etiqueta de imagen y le asignamos la API global estable
    const imgQr = document.getElementById('img-qr');
    imgQr.src = `https://qrserver.com{encodeURIComponent(codigo)}`;

    // 4. Función centralizada de impresión con delay para evitar el bloqueo del navegador
    function ejecutarImpresionSegura() {
      setTimeout(function() {
        window.print();
        setTimeout(function() { window.close(); }, 600);
      }, 1200); // 1.2 segundos para garantizar que el renderizado de la imagen finalice
    }

    // 5. Disparadores de control
    if (imgQr.complete) {
      ejecutarImpresionSegura();
    } else {
      imgQr.onload = ejecutarImpresionSegura;
      imgQr.onerror = function() {
        // Respaldo automático por si hay microcortes en la red
        ejecutarImpresionSegura();
      };
    }
  </script>
</body>
</html>
