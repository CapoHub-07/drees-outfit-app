<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etiqueta QR - Drees Outfit</title>
  
  <!-- Librerías de Supabase y Tailwind CSS -->
  <script src="https://jsdelivr.net"></script>
  <script src="https://tailwindcss.com"></script>

  <style>
    /* Estilos base para la optimización del papel térmico de ticketera */
    @page {
      size: auto;
      margin: 0mm;
    }
    body {
      margin: 0;
      padding: 10px;
      background-color: #ffffff;
      color: #000000;
    }
    /* El panel digital de variantes NO se dibuja en el papel físico impreso */
    @media print {
      .no-print {
        display: none !important;
      }
      body {
        padding: 0mm;
        background-color: #ffffff;
        color: #000000;
      }
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen bg-slate-950 p-4 text-center">

  <!-- VISTA FÍSICA DE LA ETIQUETA (Lo que sale impreso) -->
  <div class="bg-white text-black p-4 rounded-xl shadow-2xl border border-slate-200 w-full max-w-[280px] flex flex-col items-center gap-2">
    <h2 id="lbl-nombre" class="font-extrabold text-base tracking-tight uppercase break-words w-full text-center">Producto</h2>
    <p id="lbl-caracteristicas" class="text-xs font-semibold text-slate-700">Talle: - | Color: -</p>
    
    <!-- Contenedor del QR generado por API -->
    <div class="w-[140px] h-[140px] bg-white p-1 flex items-center justify-center border border-slate-300 rounded-lg">
      <img id="img-qr" alt="Código QR del Producto" class="w-full h-full object-contain" />
    </div>
    
    <span id="lbl-codigo" class="text-[10px] font-mono tracking-widest text-slate-500 uppercase mt-0.5">000000</span>
  </div>

  <!-- PANEL DIGITAL INTERACTIVO (Sólo visible al escanear con el celular) -->
  <div id="panel-variantes-digital" class="no-print hidden w-full max-w-[280px] bg-slate-900/90 border border-amber-500/20 rounded-xl p-4 mt-4 space-y-3 shadow-xl text-left">
    <h4 class="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
      👕 Talles y Colores Disponibles
    </h4>
    <div id="lista-variantes-clientes" class="flex flex-col gap-2 text-xs text-slate-300">
      <span class="text-slate-500 italic animate-pulse">Consultando disponibilidad en tiempo real...</span>
    </div>
  </div>

  <script>
        // 1. LECTURA INMEDIATA DE PARÁMETROS (Sin dependencias)
    const urlParams = new URLSearchParams(window.location.search);
    const codigo = urlParams.get('codigo') || '000000';
    const nombre = urlParams.get('nombre') || 'Producto';
    const talle = urlParams.get('talle') || '-';
    const color = urlParams.get('color') || '-';
    const urlQR_Dinamico = urlParams.get('urlqr') || (window.location.origin + '/consulta.html?codigo=' + codigo);

    // 2. INYECCIÓN VISUAL INSTANTÁNEA (Cambia los textos antes de procesar lógica)
    document.getElementById('lbl-nombre').textContent = nombre;
    document.getElementById('lbl-caracteristicas').textContent = `Talle: ${talle} | Color: ${color}`;
    document.getElementById('lbl-codigo').textContent = codigo;

    // 3. GENERACIÓN DEL CÓDIGO QR
    const imgElement = document.getElementById('img-qr');
    const qrApiUrl = `https://qrserver.com{encodeURIComponent(urlQR_Dinamico)}`;

    // 4. DETECTOR DE IMPRESIÓN PRIORITARIO
    const esImpresion = urlParams.has('print') || window.opener !== null;

    let impreso = false;
    function dispararImpresion() {
      if (impreso) return;
      impreso = true;
      setTimeout(function() {
        window.print();
        setTimeout(function() { window.close(); }, 300);
      }, 300);
    }

    // 5. EVALUACIÓN DE COMPORTAMIENTO
    if (esImpresion) {
      // MODO IMPRESIÓN COMPU: Removemos físicamente el cuadro digital de inmediato
      const panelVariantes = document.getElementById('panel-variantes-digital');
      if (panelVariantes) panelVariantes.remove();

      // Dispara la ticketera directo al cargar el QR
      imgElement.onload = function() { dispararImpresion(); };
      imgElement.onerror = function() { dispararImpresion(); };
      setTimeout(function() { dispararImpresion(); }, 1500);

    } else {
      // MODO CELULAR: Entorno oscuro y consulta a Supabase
      document.body.classList.remove('bg-white');
      imgElement.onload = null;
      
      const panelVariantes = document.getElementById('panel-variantes-digital');
      if (panelVariantes) panelVariantes.classList.remove('hidden');
      
      // Inicializar base de datos SOLO si es un móvil escaneando
      try {
        const SUPABASE_URL = "https://zzmojfukciqbxrjnmdeo.supabase.co";
        const SUPABASE_KEY = "sb_publishable_m6UEIb277hu0TvPTnFaGyg_FzFiKixX";
        
        if (SUPABASE_URL !== "https://zzmojfukciqbxrjnmdeo.supabase.co") {
          const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          cargarVariantesDelProducto(_supabase, nombre);
        } else {
          document.getElementById('lista-variantes-clientes').innerHTML = '<span class="text-amber-400 italic">Configura las claves de Supabase en etiqueta.html para ver el stock en vivo.</span>';
        }
      } catch (e) {
        console.error("Faltan configurar las credenciales de Supabase en este archivo:", e);
      }
    }

    // Asignamos la ruta al final para iniciar el renderizado
    imgElement.src = qrApiUrl;

    // ==========================================
    // FUNCIÓN LÓGICA DE CONSULTA (Mantenida intacta)
    // ==========================================
    async function cargarVariantesDelProducto(client, nombrePrenda) {
      const listaContainer = document.getElementById('lista-variantes-clientes');
      if (!listaContainer) return;

      try {
        const { data: variantes, error } = await client
          .from('productos')
          .select('talle, color, stock_actual')
          .eq('nombre', nombrePrenda);

        if (error) throw error;
        listaContainer.innerHTML = '';

        if (variantes && variantes.length > 0) {
          variantes.forEach(v => {
            const tieneStock = v.stock_actual > 0;
            const badgeColor = tieneStock ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border-rose-500/20';
            const badgeTexto = tieneStock ? `📦 ${v.stock_actual} un.` : '❌ Sin Stock';

            listaContainer.innerHTML += `
              <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 flex justify-between items-center">
                <div>
                  <span class="text-white font-bold">Talle: <b class="text-amber-400">${v.talle}</b></span>
                  <p class="text-slate-400 text-[11px] mt-0.5">Color: ${v.color}</p>
                </div>
                <span class="text-[11px] font-bold px-2.5 py-1 rounded-md border ${badgeColor}">
                  ${badgeTexto}
                </span>
              </div>
            `;
          });
        } else {
          listaContainer.innerHTML = '<span class="text-rose-400 italic">No se encontraron otras variantes.</span>';
        }
      } catch (err) {
        console.error(err);
        listaContainer.innerHTML = '<span class="text-rose-400 italic">Error al conectar con el inventario.</span>';
      }
    }

  </script>
</body>
</html>
