<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Imprimir Etiqueta QR</title>
  <!-- Cargamos la librería nativa para dibujar códigos QR localmente -->
  <script src="https://cloudflare.com"></script>
  <style>
    body { 
      font-family: 'Helvetica Neue', Arial, sans-serif; 
      text-align: center; 
      margin: 0; 
      padding: 10px;
      color: #000;
      background: #fff;
    }
    .etiqueta-box {
      border: 2px dashed #000;
      padding: 15px;
      display: inline-block;
      width: 260px;
    }
    .marca { 
      font-size: 14px; 
      font-weight: 900; 
      letter-spacing: 2px; 
      margin-bottom: 2px;
    }
    #canvas-qr { 
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px auto;
      width: 140px; 
      height: 140px; 
    }
    #canvas-qr img {
      width: 140px;
      height: 140px;
    }
    .precio { 
      font-size: 20px; 
      font-weight: bold; 
      margin-top: 4px;
    }
    .caracteristicas {
      font-size: 10px;
      color: #555;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="etiqueta-box">
    <div class="marca">DREES OUTFIT</div>
    <div id="lbl-nombre" class="marca" style="font-size:12px; font-weight:normal; letter-spacing:normal;">Cargando...</div>
    <div id="lbl-caracteristicas" class="caracteristicas">Talle: - | Color: -</div>
    
    <!-- Contenedor donde la librería dibujará el QR perfecto -->
    <div id="canvas-qr"></div>
    
    <div id="lbl-precio" class="precio">$0</div>
    <div id="lbl-codigo" style="font-size: 8px; color: #888; font-family: monospace; margin-top: 4px;">-</div>
  </div>

  <script>
    // 1. Leemos los parámetros que viajan por la URL de forma segura
    const urlParams = new URLSearchParams(window.location.search);
    const codigo = urlParams.get('codigo') || '000000';
    const nombre = urlParams.get('nombre') || 'Producto';
    const precio = parseFloat(urlParams.get('precio')) || 0;
    const talle = urlParams.get('talle') || '-';
    const color = urlParams.get('color') || '-';

    // 2. Inyectamos los datos reales de la prenda en la plantilla visual
    document.getElementById('lbl-nombre').textContent = nombre;
    document.getElementById('lbl-caracteristicas').textContent = 'Talle: ' + talle + ' | Color: ' + color;
    document.getElementById('lbl-precio').textContent = '$' + precio.toLocaleString('es-AR');
    document.getElementById('lbl-codigo').textContent = codigo;

    // 3. Dibujamos el QR de forma local e instantánea en el contenedor
    const contenedorQR = document.getElementById('canvas-qr');
    new QRCode(contenedorQR, {
      text: codigo,
      width: 140,
      height: 140,
      colorDark : "#000000",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.H
    });

    // 4. Esperamos una pequeña fracción de segundo para asegurar la inyección antes de imprimir
    setTimeout(function() {
      window.print();
      setTimeout(function() { window.close(); }, 600);
    }, 800);
  </script>
</body>
</html>
